<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1011">
  <title>Dreamliner · Résumé</title>
  <meta name="description" content="Résumé of Dreamliner: rocketry, materials science and engineering">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- City + waves background (js/scene.js) -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Boot screen: also unlocks audio, since browsers need a click/key first -->
  <div id="splash" role="button" tabindex="0" aria-label="Start">
    <svg class="splash-ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="42"/>
      <circle class="draw" cx="50" cy="50" r="42"/>
    </svg>
    <h1 class="splash-name" data-site-name>Dreamliner</h1>
    <p class="splash-tagline" data-site-tagline></p>
    <p class="splash-hint">press any key. any of them.</p>
  </div>

  <!-- Top-right status: clock + mute -->
  <header id="status">
    <div id="clock"><span class="clock-time"></span><span class="clock-date"></span></div>
    <button id="mute" type="button" aria-label="Toggle music" title="Music on/off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave1" d="M16 9a4 4 0 0 1 0 6"/><path class="wave2" d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
  </header>

  <!-- The menu (js/xmb.js builds the contents) -->
  <main id="xmb" aria-label="Menu">
    <nav id="categories" aria-label="Categories"></nav>
    <h2 id="cat-title" aria-live="polite"></h2>
    <ul id="items" aria-label="Items"></ul>
    <p id="hint" class="hint">← → categories · ↑ ↓ items · enter to open</p>
  </main>

  <!-- Detail page shown when an item is opened (js/detail.js) -->
  <section id="detail" hidden aria-modal="true" role="dialog">
    <div class="panel">
      <span class="stripe" aria-hidden="true"></span>
      <button class="close" type="button" aria-label="Back">esc ✕</button>
      <div class="panel-scroll"></div>
    </div>
  </section>

  <!-- Full-size image viewer -->
  <div id="lightbox" hidden>
    <button class="lb-prev" type="button" aria-label="Previous image">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-next" type="button" aria-label="Next image">›</button>
  </div>

  <noscript>
    <div class="noscript">This site needs JavaScript for its menu. Please enable it.</div>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/sun.js"></script>
  <script src="js/launches.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/xmb.js"></script>
  <script src="js/nowplaying.js"></script>
</body>
</html>
