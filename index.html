<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1011">
  <title>Dreamliner.web</title>
  <meta name="apple-mobile-web-app-title" content="Dreamliner.web">
  <meta property="og:site_name" content="Dreamliner.web">
  <meta name="description" content="Résumé of Dreamliner: rocketry, materials science and engineering">
  <meta http-equiv="Cache-Control" content="no-cache">
  <!-- Self-update: always run the latest published version, even in a tab left open for days or restored with Back.
       Checks version.json on load, when the tab comes back into view, when it's restored from the back/forward cache,
       and every 5 minutes. A newer version found on load reloads at once; one found later waits for a moment that
       won't lose anything (a page change, or coming back to the tab) and never interrupts typing or a playing video.
       SITE_VERSION and the ?v= tags are kept in sync by ./bump-version.sh -->
  <script>
    (function () {
      var SITE_VERSION = "20261008144514";
      if (!window.fetch) return;
      var newer = null, last = 0;
      function busy() {
        var a = document.activeElement, m = document.querySelectorAll("video, audio");
        if (a && /^(TEXTAREA|INPUT)$/.test(a.tagName) && a.value) return true;
        for (var i = 0; i < m.length; i++) if (!m[i].paused && !m[i].ended) return true;
        return false;
      }
      function reload() {
        if (!newer || busy()) return;
        var key = "site.reloaded." + newer;   // reload at most once per new version
        try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); } catch (e) {}
        var v = newer;
        function go() {
          var u = new URL(location.href);
          u.searchParams.set("v", v);          // a new URL, so the browser fetches fresh HTML
          location.replace(u.toString());
        }
        var clears = [];
        if (window.caches && caches.keys) clears.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) clears.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        Promise.all(clears).catch(function () {}).then(go, go);
      }
      function check(now) {
        if (newer) { if (now) reload(); return; }
        if (Date.now() - last < 10000) return;  // at most every 10 seconds
        last = Date.now();
        fetch("version.json?t=" + last, { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (!d || !d.v || d.v === SITE_VERSION) return;
            newer = d.v;
            if (now) reload();
          })
          .catch(function () {});
      }
      check(true);
      addEventListener("pageshow", function (e) { if (e.persisted) { last = 0; check(true); } });
      addEventListener("hashchange", function () { check(true); });
      addEventListener("focus", function () { check(true); });
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") check(true); });
      setInterval(function () { check(false); }, 5 * 60 * 1000);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261008144514">
</head>
<body>
  <!-- City + waves background (js/scene.js) -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Gritty overlays: film grain, scanlines, vignette -->
  <div id="grain" aria-hidden="true"></div>
  <div id="scanlines" aria-hidden="true"></div>

  <!-- The window pane: rain falling outside and drops running down the glass (js/rain.js) -->
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- Boot screen: also unlocks audio, since browsers need a click/key first -->
  <div id="splash" role="button" tabindex="0" aria-label="Start">
    <svg class="splash-ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="42"/>
      <circle class="draw" cx="50" cy="50" r="42"/>
    </svg>
    <h1 class="splash-name" data-site-name>Dreamliner</h1>
    <p class="splash-tagline">connecting to live services<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
    <p class="splash-hint">press any key. any of them.</p>
  </div>

  <!-- Top-right status: clock + mute -->
  <header id="status">
    <div id="clock"><span class="clock-time"></span><span class="clock-date"></span></div>
    <button id="mute" type="button" aria-label="Toggle music" title="Music on/off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave1" d="M16 9a4 4 0 0 1 0 6"/><path class="wave2" d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
  </header>

  <!-- The menu (js/xmb.js builds the contents) -->
  <main id="xmb" aria-label="Menu">
    <nav id="categories" aria-label="Categories"></nav>
    <h2 id="cat-title" aria-live="polite"></h2>
    <ul id="items" aria-label="Items"></ul>
    <p id="hint" class="hint">← → categories · ↑ ↓ items · enter to open</p>
  </main>

  <!-- Detail page shown when an item is opened (js/detail.js) -->
  <section id="detail" hidden aria-modal="true" role="dialog">
    <div class="panel">
      <span class="stripe" aria-hidden="true"></span>
      <button class="close" type="button" aria-label="Back">esc ✕</button>
      <div class="panel-scroll"></div>
    </div>
  </section>

  <!-- Full-size image viewer -->
  <div id="lightbox" hidden>
    <button class="lb-prev" type="button" aria-label="Previous image">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-next" type="button" aria-label="Next image">›</button>
  </div>

  <noscript>
    <div class="noscript">This site needs JavaScript for its menu. Please enable it.</div>
  </noscript>

  <script src="js/content.js?v=20261008144514"></script>
  <script src="js/sun.js?v=20261008144514"></script>
  <script src="js/launches.js?v=20261008144514"></script>
  <script src="js/scene.js?v=20261008144514"></script>
  <script src="js/rain.js?v=20261008144514"></script>
  <script src="js/audio.js?v=20261008144514"></script>
  <script src="js/detail.js?v=20261008144514"></script>
  <script src="js/xmb.js?v=20261008144514"></script>
  <script src="js/nowplaying.js?v=20261008144514"></script>
</body>
</html>
